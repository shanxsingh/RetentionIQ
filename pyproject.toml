[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retentioniq"
version = "0.1.0"
description = "Recruiter-ready advanced data science project for churn risk, uplift targeting, and model monitoring."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0"
]

[project.scripts]
retentioniq = "retentioniq.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
